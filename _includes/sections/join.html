<section class="section section--join" id="join" aria-labelledby="join-title">
  <div class="join-layout">
    <div class="join-layout__content">
      <p class="eyebrow">Join the network</p>
      <h2 id="join-title">You already belong here.</h2>
      <p class="lead">
        Organize, speak, mentor, learn, or simply meet Ruby people beyond your
        city. Join the conversation and contribute at your own pace.
      </p>

      <div class="join-actions">
        <a
          class="btn btn--primary btn--large"
          href="https://discord.gg/VQpDWPpBZe"
          target="_blank"
          rel="noopener noreferrer"
          >Join the Discord</a
        >
        <a class="join-email" href="mailto:contact@rubyeurope.com">
          Prefer email? Reach out directly
        </a>
      </div>
    </div>

    <div class="join-discord">
      <img
        src="{{ '/assets/images/discord-qr.png' | relative_url }}"
        alt="QR code to join the Ruby Europe Discord"
        width="450"
        height="450"
        loading="lazy"
      />
      <p>Scan to join on Discord</p>
    </div>
  </div>
</section>
