<section class="section section--join" id="join">

    already belong here. Let's shape the future of Ruby in Europe. Together.
  </p>

  <div class="join-actions">
    <a class="btn btn--primary" href="https://discord.gg/VQpDWPpBZe" target="_blank" rel="noopener">Join the Discord</a>

    <img src="{{ '/assets/images/discord-qr.png' | relative_url }}" alt="Ruby Europe Discord QR code" width="200" height="200" />

  </div>
