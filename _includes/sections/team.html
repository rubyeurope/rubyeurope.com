<section class="section section--team" id="team" aria-labelledby="team-title">
  <div class="section-heading">
    <p class="eyebrow">Organizers and contributors</p>
    <h2 id="team-title">The team</h2>
  </div>

  <ul class="team-grid">
    {%- for member in site.data.team -%}
    <li class="team-member">
      <img
        class="team-member__photo"
        src="{{ member.photo | prepend: '/assets/images/' | relative_url }}"
        alt="Portrait of {{ member.name }}"
        width="720"
        height="600"
        loading="lazy"
      />
      <div class="team-member__body">
        <h3 class="team-member__name">{{ member.name }}</h3>
        <p class="team-member__role">{{ member.role }}</p>
        {%- if member.linkedin -%}
        <a
          class="arrow-link team-member__link"
          href="{{ member.linkedin }}"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn <span aria-hidden="true">↗</span>
          <span class="visually-hidden">(opens in a new tab)</span>
        </a>
        {%- endif -%}
      </div>
    </li>
    {%- endfor -%}
  </ul>
</section>
