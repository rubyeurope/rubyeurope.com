<section class="section section--team" id="team">
  <h2>The team</h2>
  <p class="lead">Ruby Europe is built by people who care about the ecosystem.</p>

  <ul class="team-grid">
    {% for member in site.data.team %}
      <li class="team-member">
        <img
          class="team-member__photo"
          src="{{ member.photo | prepend: '/assets/images/' | relative_url }}"
          alt="{{ member.name }}"
        />
        <div class="team-member__body">
          <h3 class="team-member__name">{{ member.name }}</h3>
          <p class="team-member__role">{{ member.role }}</p>
          {% if member.linkedin %}
            <a class="team-member__link" href="{{ member.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
          {% endif %}
        </div>
      </li>
    {% endfor %}
  </ul>
</section>
