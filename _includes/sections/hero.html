<section class="hero" id="hero" aria-labelledby="hero-title">
  <img
    class="hero__field"
    src="{{ '/assets/images/hero-europe-1500w.webp' | relative_url }}"
    srcset="
      {{ '/assets/images/hero-europe-770w.webp' | relative_url }} 768w,
      {{ '/assets/images/hero-europe-1500w.webp' | relative_url }} 1500w,
      {{ '/assets/images/hero-europe.webp' | relative_url }} 3843w
    "
    sizes="100vw"
    width="3843"
    height="1665"
    alt=""
    aria-hidden="true"
    fetchpriority="high"
    decoding="async"
  />
  <div class="hero__inner">
    <div class="hero__content">
      <p class="eyebrow">Ruby Europe</p>
      <h1 class="hero__title" id="hero-title">
        Grow your
        <span class="hero__title-accent">community</span>
      </h1>
      <p class="hero__lead">A shared home for Rubyists across Europe.</p>
      <div class="cta-row">
        <a
          class="btn btn--primary"
          href="https://discord.gg/VQpDWPpBZe"
          target="_blank"
          rel="noopener"
          >Join the Discord</a
        >
        <a class="btn btn--ghost" href="{{ '/#who-we-are' | relative_url }}"
          >Learn more</a
        >
      </div>
    </div>
  </div>
</section>
