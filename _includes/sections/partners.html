<section
  class="section section--partners"
  id="partners"
  aria-labelledby="partners-title"
>
  <div class="section-heading section-heading--split">
    <div>
      <p class="eyebrow">Local roots</p>
      <h2 id="partners-title">Partner communities</h2>
    </div>
    <p class="lead">Independent Ruby communities, connected across Europe.</p>
  </div>

  <ul class="partner-wall" aria-label="Ruby Europe partner communities">
    {%- for partner in site.data.partners.partners -%}
    <li class="partner">
      <img
        src="{{ partner.logo | prepend: '/assets/images/' | relative_url }}"
        alt="{{ partner.name }}"
        loading="lazy"
      />
    </li>
    {%- endfor -%}
  </ul>

  <p class="partner-note">
    Looking for a Ruby community near you? Explore the maintained directory on
    <a
      href="{{ site.data.partners.rubyevents_hub }}"
      target="_blank"
      rel="noopener noreferrer"
      >rubyevents.org</a
    >.
  </p>
</section>
