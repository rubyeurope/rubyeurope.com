# The communities on the map and in the "Five cities" list, in ring order.
#
# The ring on the map joins the cities in the order below and closes back to
# the first one, so keep geographic neighbours next to each other.
#
# x / y: marker position in percent of the map. Compute them with
#   bin/map-position LAT LON
# label: which side of the marker the city name sits on (e, w, n or s).
#   Pick the side that does not collide with a neighbour at 340px map width.
# lat / lon are quoted so the list keeps three decimals.

