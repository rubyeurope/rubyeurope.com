highlights:
  - title: Paris.rb explores practical AI
    city: Paris
    country: France
    date: 2025-10-07
    summary: >-
      Paris.rb hosted three recorded talks covering FastMCP, Claude Swarm, and
      running AI offline, bringing practical Ruby and AI work to its local audience.
    link: https://www.rubyevents.org/talks/paris-rb-meetup-october-2025
    link_label: Watch the three talks

  - title: Production-ready MCP in Berlin
    city: Berlin
    country: Germany
    date: 2025-06-24
    summary: >-
      The Berlin Ruby + AI meetup included a production-focused Rails session on
      Model Context Protocol, OAuth-secured authorization, and lessons from using MCP
      with Rails in production.
    link: https://www.rubyevents.org/talks/berlin-ruby-ai-meetup-june-2025
    link_label: Explore the Berlin recording

  - title: Ruby + AI connects in London
    city: London
    country: United Kingdom
    date: 2025-06-17
    summary: >-
      Ruby Europe organized a London meetup focused on connecting AI models to Ruby
      applications and modern test-driven development practices enhanced by AI.
    link: https://www.rubyevents.org/talks/london-ruby-ai-meetup-june-2025
    link_label: Explore the London talks
